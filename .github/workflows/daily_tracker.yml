name: 游戏榜单每日追踪

on:
  schedule:
    - cron: '0 9 * * *'   # 每天上午9点（北京时间）执行
  workflow_dispatch:      # 支持手动触发

permissions:
  contents: write         # 允许 workflow 推送 data/ 和 reports/ 变更

jobs:
  run-tracker:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v3

      - name: 设置 Python 环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          pip install -r requirements.txt

      - name: 执行数据抓取和报告生成
        run: |
          python main.py

      - name: 提交并推送数据文件
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git add reports/
          git commit -m "自动更新: 每日榜单数据 $(date '+%Y-%m-%d') [skip ci]" || exit 0
          git push
